name: SETwin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: setwin
          POSTGRES_PASSWORD: setwin
          POSTGRES_DB: setwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setwin -d setwin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
        env:
          SETWIN_DATABASE_URL: postgresql://setwin:setwin@127.0.0.1:5432/setwin
