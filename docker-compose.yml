services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: setwin
      POSTGRES_PASSWORD: setwin
      POSTGRES_DB: setwin
    ports:
      - "5432:5432"
    volumes:
      - setwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setwin -d setwin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  setwin_pgdata:
